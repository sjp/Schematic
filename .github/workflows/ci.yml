name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore: &paths-ignore
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '*.png'
      - '*.svg'
  pull_request:
    branches: [ master ]
    paths-ignore: *paths-ignore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: src/SJP.Schematic.Reporting/ui/package-lock.json

    - name: Cache UI build output
      uses: actions/cache@v6
      with:
        path: |
          src/SJP.Schematic.Reporting/obj/npm-ci.stamp
          src/SJP.Schematic.Reporting/obj/vite-build.stamp
          src/SJP.Schematic.Reporting/ui/node_modules
          src/SJP.Schematic.Reporting/ui/dist
        key: ui-build-${{ runner.os }}-${{ hashFiles('src/SJP.Schematic.Reporting/ui/*.json', 'src/SJP.Schematic.Reporting/ui/*.html', 'src/SJP.Schematic.Reporting/ui/*.ts', 'src/SJP.Schematic.Reporting/ui/src/**') }}

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Install dependencies
      run: dotnet restore
      working-directory: src

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src

    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal -- --coverage --coverage-settings ${{ github.workspace }}/src/coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      working-directory: src

    - name: Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: dotnet
