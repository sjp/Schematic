name: postgres

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore: &paths-ignore
      - 'src/SJP.Schematic.Reporting/ui/**'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '*.png'
      - '*.svg'
  pull_request:
    branches: [ master ]
    paths-ignore: *paths-ignore

jobs:
  db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [14, 15, 16, 17, 18, latest]
    services:
      postgres:
        image: postgres:${{ matrix.tag }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Install dependencies
      run: dotnet restore
      working-directory: src/SJP.Schematic.PostgreSql.Tests

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src/SJP.Schematic.PostgreSql.Tests

    # --minimum-expected-tests fails the run when fewer tests actually execute than expected.
    # Skipped tests do not count towards it, which is the point: an unreachable database --
    # a wrong connection string, or a service container that died after passing its health
    # check -- skips every integration test, and without this the job would still go green on
    # the unit tests alone. The number is this project's unit plus integration total with a
    # little headroom for version-gated skips, so raise it as tests are added.
    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal -- --show-test-results failed --minimum-expected-tests 750 --coverage --coverage-settings ${{ github.workspace }}/src/coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      working-directory: src/SJP.Schematic.PostgreSql.Tests
      env:
        ConnectionStrings__PostgreSql_TestDb: Server=localhost; Port=5432; Database=postgres; User Id=postgres; Password=postgres; Timeout=2

    - name: Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: postgres
