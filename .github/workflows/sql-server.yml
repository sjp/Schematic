name: sql-server

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore: &paths-ignore
      - 'src/SJP.Schematic.Reporting/ui/**'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '*.png'
      - '*.svg'
  pull_request:
    branches: [ master ]
    paths-ignore: *paths-ignore

jobs:
  db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [2019-latest, 2022-latest, 2025-latest, latest]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.tag }}
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: Schematic0123!
          MSSQL_TOOLS_PATH: '/opt/mssql-tools18/bin/sqlcmd'
        options: >-
          --health-cmd "${MSSQL_TOOLS_PATH} -C -U sa -P \"${SA_PASSWORD}\" -Q \"SELECT 1\""
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 1433:1433
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Install dependencies
      run: dotnet restore
      working-directory: src/SJP.Schematic.SqlServer.Tests

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src/SJP.Schematic.SqlServer.Tests

    # --minimum-expected-tests fails the run when fewer tests actually execute than expected.
    # Skipped tests do not count towards it, which is the point: an unreachable database --
    # a wrong connection string, or a service container that died after passing its health
    # check -- skips every integration test, and without this the job would still go green on
    # the unit tests alone. The number is this project's unit plus integration total with a
    # little headroom for version-gated skips, so raise it as tests are added.
    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal -- --show-test-results failed --minimum-expected-tests 600 --coverage --coverage-settings ${{ github.workspace }}/src/coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      working-directory: src/SJP.Schematic.SqlServer.Tests
      env:
        ConnectionStrings__SqlServer_TestDb: Data Source=localhost,1433; User Id=sa; Password=Schematic0123!; MultipleActiveResultSets=True; TrustServerCertificate=True;

    - name: Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: sql-server
